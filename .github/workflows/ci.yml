name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-specs:
    name: Validar OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validar specs
        run: openspec validate --all --strict